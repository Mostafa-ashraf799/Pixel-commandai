name: Build Pixel CommandAI Executables

# يشتغل تلقائيًا مع كل push على main، أو يدويًا من تبويب Actions،
# أو مع كل تاج إصدار جديد (v1.0.0, v1.0.1, ...).
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      # لو نظام واحد فشل، الباقي يكمل عادي (بدل ما الكل يقف).
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: pixel-cai-linux
          - os: windows-latest
            artifact_name: pixel-cai-windows.exe
          - os: macos-latest
            artifact_name: pixel-cai-macos

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Build executable (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          pyinstaller --onefile --name pixel-cai cai/ui/shell.py

      - name: Build executable (Windows)
        if: runner.os == 'Windows'
        run: |
          pyinstaller --onefile --name pixel-cai cai/ui/shell.py

      - name: Rename output (Linux)
        if: runner.os == 'Linux'
        run: mv dist/pixel-cai dist/pixel-cai-linux

      - name: Rename output (macOS)
        if: runner.os == 'macOS'
        run: mv dist/pixel-cai dist/pixel-cai-macos

      - name: Rename output (Windows)
        if: runner.os == 'Windows'
        run: mv dist/pixel-cai.exe dist/pixel-cai-windows.exe

      # يرفع كل نسخة كـ "artifact" تقدر تنزلها من صفحة الـ Actions run نفسها.
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.artifact_name }}

  # لو الـ push كان بتاج إصدار (زي v1.0.0)، يجمع الثلاث نسخ في
  # GitHub Release واحد جاهز يتحمّل منه مباشرة.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/pixel-cai-linux/pixel-cai-linux
            dist/pixel-cai-windows.exe/pixel-cai-windows.exe
            dist/pixel-cai-macos/pixel-cai-macos
